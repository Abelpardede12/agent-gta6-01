<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sunset Keys — an open-city crime mini-game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff6e8; z-index: 5; }
  #hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px; gap: 12px; }
  .pill { background: rgba(16, 12, 24, 0.62); border: 1px solid rgba(255, 246, 232, 0.25); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 20px; letter-spacing: 0.02em; text-shadow: 0 2px 6px rgba(0,0,0,0.6); white-space: nowrap; }
  #money { color: #7dff9e; }
  #mission { font-size: 16px; font-weight: 600; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  #mission .urgent { color: #ff6b5e; }
  #stars { color: #ffd23f; letter-spacing: 4px; font-size: 24px; }
  #stars.hot { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  #hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px; }
  #minimap { width: 200px; height: 150px; border: 2px solid rgba(255, 246, 232, 0.4); border-radius: 10px; background: #10131c; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  #speed-box { text-align: right; }
  #speed { font-size: 30px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  #hp-wrap { width: 170px; height: 10px; margin-top: 6px; margin-left: auto; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,246,232,0.35); border-radius: 999px; overflow: hidden; }
  #hp-fill { height: 100%; width: 100%; background: #7dff9e; transition: width 0.2s; }
  #hp-fill.low { background: #ff6b5e; }
  #hp-label { font-size: 11px; letter-spacing: 0.14em; opacity: 0.85; margin-top: 3px; }
  .hidden { display: none !important; }

  #toast { position: absolute; top: 84px; left: 50%; transform: translateX(-50%) translateY(-8px); background: rgba(16, 12, 24, 0.78); border: 1px solid rgba(255, 210, 63, 0.55); color: #ffe9a8; border-radius: 10px; padding: 10px 18px; font-size: 16px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(26, 10, 34, 0.62) 0%, rgba(60, 20, 10, 0.55) 100%); color: #fff6e8; padding: 20px; cursor: pointer; }
  #overlay-title { font-size: clamp(44px, 9vw, 92px); font-weight: 900; letter-spacing: 0.06em; line-height: 1; margin: 0 0 14px; background: linear-gradient(90deg, #ffd23f, #ff8c42 45%, #ff5e7a); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55)); }
  #overlay-body { font-size: clamp(15px, 2.2vw, 19px); line-height: 1.65; max-width: 620px; opacity: 0.95; }
  #overlay-body b { color: #ffd23f; }
  #overlay-hint { margin-top: 26px; font-size: 17px; font-weight: 700; letter-spacing: 0.08em; color: #ffd23f; animation: pulse 1.4s ease-in-out infinite; }

  #touch { position: fixed; inset: auto 0 0 0; z-index: 8; display: none; justify-content: space-between; padding: 0 18px 86px; pointer-events: none; }
  @media (pointer: coarse) { #touch { display: flex; } }
  .tcluster { display: flex; gap: 12px; pointer-events: auto; }
  .tbtn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,246,232,0.5); background: rgba(16,12,24,0.5); color: #fff6e8; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  .tbtn:active { background: rgba(255,210,63,0.55); }
  .tbtn.action { width: 76px; height: 76px; font-size: 22px; border-color: rgba(255,210,63,0.8); color: #ffd23f; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset Keys: drive and walk around a sun-soaked coastal city, steal cars, outrun the police and run timed jobs for cash"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div id="hud">
  <div id="hud-top">
    <div class="pill" id="money">$0</div>
    <div class="pill" id="mission">Vex is lining up a job…</div>
    <div class="pill" id="stars">☆☆☆☆☆</div>
  </div>
  <div id="toast"></div>
  <div id="hud-bottom">
    <canvas id="minimap" width="200" height="150" aria-label="Minimap"></canvas>
    <div id="speed-box">
      <div id="speed">ON FOOT</div>
      <div id="hp-wrap" class="hidden"><div id="hp-fill"></div></div>
      <div id="hp-label">RIDE CONDITION</div>
    </div>
  </div>
</div>

<div id="overlay">
  <h1 id="overlay-title">SUNSET KEYS</h1>
  <div id="overlay-body"></div>
  <div id="overlay-hint">Click or press Space to start</div>
</div>

<div id="touch">
  <div class="tcluster">
    <div class="tbtn" data-key="left">◀</div>
    <div class="tbtn" data-key="right">▶</div>
  </div>
  <div class="tcluster">
    <div class="tbtn action" data-key="enter">E</div>
    <div class="tbtn" data-key="up">▲</div>
    <div class="tbtn" data-key="down">▼</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
